# ControlHub 配置示例
# 复制为 config.yaml 后按需修改；不提供 config.yaml 时使用内置默认值。

# 本地 HTTP 服务（API + 内置 Web 界面）
http:
  host: "127.0.0.1"
  port: 17890
  # 启动即监听 0.0.0.0（局域网可访问）。控制台「设置」里的 LAN 模式开关
  # 持久化后优先生效；两者任一为 true 即局域网开放。
  lan_mode: false
  # 是否注册 /api/v1 控制接口。false = 纯静态模式（只提供 Web 页面，
  # 控制台/演示台因无 API 将不可操作，一般仅用于纯展示场景）。
  enable_api: true

# 嵌入式 MQTT broker（M1-G3 网络模型：bind / advertise 拆分）
mqtt:
  # broker 监听地址。默认 0.0.0.0——设备经 LAN 接入是产品主场景
  #（broker 有 per-device 凭据 + ACL 保护；只想本机用可改回 127.0.0.1）。
  bind_host: "0.0.0.0"
  port: 17891
  # 返回给设备的 broker 地址。留空 = 自动解析（优先设备请求实际到达的本机
  # 地址，其次唯一可用 LAN IPv4；多网卡歧义时配对会明确报错）。
  # 环回 / localhost / 0.0.0.0 在此禁止——对设备不可达。
  advertise_host: ""
  # ControlHub 内部 MQTT 凭据。两者必须成对配置；都留空 = 每次启动随机生成
  #（仅存在内存，不持久化、不进日志）。设备凭据是配对时按设备签发的，与此无关。
  # username: "controlhub"
  # password: ""

# 设备侧配对服务（Provision Mode 设备接入用）
pairing:
  enabled: true
  port: 17892

# 内置 Web 界面各页面开关
web:
  console: true   # 控制台 + API 测试页（/ 与 /api-test.html）
  demo: true      # 模拟键鼠演示台（/demo.html）
  realtime: true  # WebSocket 实时事件通道（/api/v1/realtime，设备状态/命令回执推送）

# API Key：留空则首次启动随机生成，仅写入 data_dir/initial-api-key.txt（0600，不进日志）
api_key: ""

# 数据目录（SQLite、日志）
data_dir: "./data"

# 日志级别：debug / info / warn / error
log_level: "info"

