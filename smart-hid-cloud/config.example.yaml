# Smart HID Cloud 配置示例
# 复制为 config.yaml 后修改

http:
  host: 127.0.0.1
  port: 17880
  # 跨域来源白名单。门户与 cloud 不同源时配置，如 ["https://smart-hid.example.com"]。
  # 含 "*" 全放行（仅开发）。留空（默认）表示同源不发 CORS 头 —— 配合 web_root 使用时无需此字段。
  cors_origins: []
  # 静态门户目录。非空时 /api/* 之外的请求走 FileServer 托管该目录，
  # 实现门户与 API 同源（开发期零 CORS）。指向 smart-hid-web 目录即可。
  # 例：./../smart-hid-web
  web_root: ""

database:
  path: ./data/cloud.db

# JWT 签发密钥（生产请改为 64 字节随机）
jwt_secret: "change-me-to-a-long-random-secret"

# License 私钥路径（用 scripts/gen-keys.sh 生成）
license_key_path: ./keys/private.key

# ControlHub 调 Cloud 时使用的共享 token（V1 简化鉴权；CL-3b 用到）
controlhub_token: ""

data_dir: ./data
log_level: info
